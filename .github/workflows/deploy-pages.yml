name: Deploy to GitHub Pages

# 本项目是零依赖静态站点，仓库根目录即为站点根目录：
#   index.html + assets/ + _dev/（测试资产）
# 推送 main 分支即自动发布到 GitHub Pages。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动把仓库的 Pages 打开，并把发布方式设为 GitHub Actions，
          # 这样就不需要手动去 Settings → Pages 里改下拉框。
          # 如果这一步报 "Resource not accessible by integration"，
          # 请手动到 Settings → Pages 把 Source 改成 GitHub Actions 后重跑本工作流。
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
